{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dcontroller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dcontroller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
{{/*
Full cluster access. An Operator resource carries a frozen DBSP pipeline that
names the resources it watches and writes at load time, so the permissions the
manager will need are not known when the chart is installed. The manager runs
every hosted operator in-process under this one service account.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dcontroller.fullname" . }}-role
  labels:
    {{- include "dcontroller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
  {{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dcontroller.fullname" . }}-rolebinding
  labels:
    {{- include "dcontroller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dcontroller.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "dcontroller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
