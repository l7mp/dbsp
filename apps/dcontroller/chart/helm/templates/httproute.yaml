{{- if and .Values.apiServer.enabled .Values.apiServer.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dcontroller.fullname" . }}-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dcontroller.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "apiServer.gateway.gatewayName is required when the gateway is enabled" .Values.apiServer.gateway.gatewayName }}
      namespace: {{ default .Release.Namespace .Values.apiServer.gateway.gatewayNamespace }}
  hostnames:
    - {{ .Values.apiServer.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "dcontroller.fullname" . }}-apiserver
          port: {{ .Values.apiServer.port }}
{{- end }}
