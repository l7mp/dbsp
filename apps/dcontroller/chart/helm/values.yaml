# Container image. The image ships the `dbsp` runtime binary, the JavaScript
# stdlib, and the dcontroller manager script.
image:
  repository: docker.io/l7mp/dcontroller
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The DBSP script the runtime executes. The image ships the manager script at
# this path; point it at a mounted volume to run a custom manager.
script: /dcontroller/dcontroller.js

# Extra command line arguments passed to the script.
extraArgs: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

crds:
  # Install the Operator CRD with the release. Turn this off when the CRD is
  # managed out of band.
  install: true
  # Keep the CRD (and with it every Operator resource) on `helm uninstall`.
  keep: true

serviceAccount:
  create: true
  # Defaults to "<name>-account" when empty.
  name: ""
  annotations: {}

rbac:
  create: true

  # The manager is granted full cluster access. An Operator resource carries a
  # frozen DBSP pipeline that names the resources it watches and writes only at
  # load time, so the permission set cannot be known when the chart is
  # installed. Narrowing this means deriving the rules from the loaded Operator
  # resources, which the manager does not do yet.

  # Policy rules appended verbatim to the manager ClusterRole.
  extraRules: []

# Embedded extension API server. It serves the operators' internal views as a
# Kubernetes API, so `kubectl` can inspect them.
apiServer:
  enabled: true

  # Deployment mode, "development" or "production".
  #   development: plain HTTP, authentication disabled, ClusterIP service
  #                (reachable through `kubectl port-forward`).
  #   production:  HTTPS with JWT authentication, service type configurable.
  mode: development

  port: 8443

  # Serve the OpenAPI schema of the view resources.
  openAPI: true

  # TLS material, used in production mode only.
  tls:
    # Name of a kubernetes.io/tls secret in the release namespace holding
    # tls.crt and tls.key. Create it with:
    #   kubectl create secret tls dcontroller-tls \
    #     --cert=apiserver.crt --key=apiserver.key -n dcontroller-system
    secretName: dcontroller-tls

    # Alternatively let the chart create the secret from inline PEM material.
    # Convenient for a first deployment, not recommended beyond that.
    # cert: |
    #   -----BEGIN CERTIFICATE-----
    #   ...
    # key: |
    #   -----BEGIN PRIVATE KEY-----
    #   ...
    cert: ""
    key: ""

  service:
    # ClusterIP, LoadBalancer or NodePort.
    type: ClusterIP
    # Fixed node port when type is NodePort; auto-assigned when empty.
    nodePort: ""
    annotations: {}

  # Expose the API server through a Gateway API HTTPRoute.
  gateway:
    enabled: false
    gatewayName: ""
    gatewayNamespace: ""
    hostname: dcontroller-api.example.com

# Path to a JSON runtime configuration file. When set, the manager reads it and
# merges it over the environment-derived configuration.
runtimeConfigFile: ""

# Additional environment variables for the manager container.
extraEnv: []
  # - name: DCONTROLLER_KUBECONFIG
  #   value: /etc/dcontroller/kubeconfig

# Additional volumes and mounts, for example to carry a runtime config file.
extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The manager holds an informer cache per watched resource kind, so memory
# scales with the size of the watched cluster state. Raise these for large
# clusters or pipelines watching many kinds.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
