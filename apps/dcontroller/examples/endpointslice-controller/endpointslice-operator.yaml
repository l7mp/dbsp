apiVersion: dcontroller.io/v1alpha1
kind: Operator
metadata:
  name: ep-operator
spec:
  sources:
    - apiGroup: ""
      kind: Service
    - apiGroup: "discovery.k8s.io"
      kind: EndpointSlice
  circuits:
    # service controller:
    # - filter services that have an endpointslice controller annotation
    # - convert into simpler shape
    # - demux on spec.ports
    - name: service-controller
      inputs: [Service]
      outputs: [ServiceView]
      pipeline:
        - "@select":
            "@exists": '$["metadata"]["annotations"]["dcontroller.io/endpointslice-controller-enabled"]'
        - "@project":
            metadata:
              name: $.metadata.name
              namespace: $.metadata.namespace
            spec:
              serviceName: $.metadata.name
              type: $.spec.type
              ports: $.spec.ports
        - "@unwind": $.spec.ports
        # One view object per port: the name carries the port identity
        # (unwinding injects nothing, and views are keyed by name).
        - "@project":
            metadata:
              name:
                "@concat": [$.spec.serviceName, "-", $.spec.ports.protocol, "-", $.spec.ports.port]
              namespace: $.metadata.namespace
            spec: $.spec
      transforms:
        - name: Reconciler
        - name: Distincter
        - name: Incrementalizer

    # endpointslice controller (ServiceView is an internal stream):
    # - join services with the corresponding endpoint slices
    # - demux on "$.endpoints"
    # - filter ready addresses
    # - demux on $.endpoints.addresses
    # - convert into simpler shape
    - name: endpointslice-controller
      inputs: [ServiceView, EndpointSlice]
      outputs: [EndpointView]
      pipeline:
        - "@join":
            "@and":
              - '@eq':
                  - $.ServiceView.spec.serviceName
                  - '$["EndpointSlice"]["metadata"]["labels"]["kubernetes.io/service-name"]'
              - '@eq':
                  - $.ServiceView.metadata.namespace
                  - $.EndpointSlice.metadata.namespace
        - "@project":
              metadata:
                name: $.ServiceView.metadata.name
                namespace: $.ServiceView.metadata.namespace
              spec:
                serviceName: $.ServiceView.spec.serviceName
                type: $.ServiceView.spec.type
                port: $.ServiceView.spec.ports.port
                targetPort: $.ServiceView.spec.ports.targetPort
                protocol: $.ServiceView.spec.ports.protocol
              endpoints: $.EndpointSlice.endpoints
        - "@unwind": $.endpoints
        - "@select":
            "@eq": ["$.endpoints.conditions.ready", true]
        - "@unwind": $.endpoints.addresses
        - "@project":
            metadata:
              namespace: $.metadata.namespace
            spec:
              serviceName: $.spec.serviceName
              type: $.spec.type
              port: $.spec.port
              targetPort: $.spec.targetPort
              protocol: $.spec.protocol
              address: $.endpoints.addresses
        - "@project":
            - "$.": $.
            - metadata:
                name:
                  "@concat":
                    - $.spec.serviceName
                    - "-"
                    - { "@hash": $.spec }
                namespace: $.metadata.namespace
      transforms:
        - name: Reconciler
        - name: Distincter
        - name: Incrementalizer
  targets:
    - kind: EndpointView
