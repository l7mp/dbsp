apiVersion: dcontroller.io/v1alpha1
kind: Operator
metadata:
  name: svc-health-operator
spec:
  sources:
    - apiGroup: ""
      kind: Pod
      labelSelector:
        matchLabels:
          "dcontroller.io/health-monitor": "enabled"
    - apiGroup: ""
      kind: Service
  circuits:
    # Circuit 1: Pod -> HealthView (one object per pod)
    - name: pod-health-monitor
      inputs: [Pod]
      outputs: [HealthView]
      pipeline:
        - "@project":
            metadata:
              name: "$.metadata.labels.app"
              namespace: "$.metadata.namespace"
            pods:
              podName: "$.metadata.name"
              ready: "$.status.conditions[?(@.type=='Ready')].status"
        - "@groupBy":
            - "$.metadata"
            - "$.pods"
        - "@project":
            metadata: "$.key"
            pods: "$.values"
      transforms:
        - name: Reconciler
        - name: Distincter
        - name: Incrementalizer

    # Circuit 2: HealthView -> Service (aggregated health annotations);
    # HealthView is an internal stream between the circuits.
    - name: svc-health-monitor
      inputs: [HealthView, Service]
      outputs: [ServiceHealth]
      pipeline:
        - "@join":
            "@and":
              - "@eq":
                  - "$.HealthView.metadata.name"
                  - "$.Service.metadata.name"
              - "@eq":
                  - "$.HealthView.metadata.namespace" 
                  - "$.Service.metadata.namespace"
        - "@project":
              metadata:
                name: "$.Service.metadata.name"
                namespace: "$.Service.metadata.namespace"
                annotations:
                  "dcontroller.io/pod-ready":
                    "@concat":
                      - "@string":
                          "@len":
                            "@filter":
                              - "@eq": ["$$.ready", "True"]
                              - "$.HealthView.pods"
                      - "/"
                      - "@string":
                          "@len": "$.HealthView.pods"
      transforms:
        - name: Reconciler
        - name: Distincter
        - name: Incrementalizer
  targets:
    - apiGroup: ""
      kind: Service
      type: Patcher
      as: ServiceHealth
