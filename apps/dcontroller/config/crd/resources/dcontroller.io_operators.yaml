---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: operators.dcontroller.io
spec:
  group: dcontroller.io
  names:
    categories:
    - dcontroller
    kind: Operator
    listKind: OperatorList
    plural: operators
    shortNames:
    - operators
    singular: operator
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Operator is an abstraction of a basic unit of automation, a set of related controllers working
          on a single shared view of resources.

          // +kubebuilder:printcolumn:name="ControllerNum",type=integer,JSONPath=`length(.spec.controllers)`
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of an operator.
            properties:
              controllers:
                description: Controllers is a list of controllers that collectively
                  implement the operator.
                items:
                  description: |-
                    Controller is a translator that processes a set of source resources via
                    a declarative pipeline into deltas on target resources. A controller is
                    defined by a name, its sources, a processing program (exactly one of
                    pipeline, sql, or circuit), its targets, and an optional transform list.
                  properties:
                    circuit:
                      description: Circuit is a hand-built dbsp circuit.
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: Name is the unique name of the controller.
                      type: string
                    pipeline:
                      description: Pipeline is an aggregation pipeline applied to
                        the source deltas.
                      x-kubernetes-preserve-unknown-fields: true
                    sources:
                      description: Sources are the resources the controller watches.
                      items:
                        description: Source is a source that feeds deltas into the
                          controller.
                        properties:
                          apiGroup:
                            description: Group is the API group. Default is "<operator>.view.dcontroller.io".
                            type: string
                          kind:
                            description: Kind is the type of the resource. Mandatory.
                            type: string
                          labelSelector:
                            description: |-
                              LabelSelector is an optional label selector filtering events on
                              this source, interpreted by the binding connector (Kubernetes
                              LabelSelector semantics: matchLabels plus matchExpressions).
                            x-kubernetes-preserve-unknown-fields: true
                          level:
                            description: |-
                              Level switches a Watcher source from delta ingest to level ingest:
                              every event carries the full snapshot instead of the increment.
                              Ignored on sources with no level mode.
                            type: boolean
                          namespace:
                            description: |-
                              Namespace, if given, restricts the source to events from that
                              namespace.
                            type: string
                          parameters:
                            description: |-
                              Parameters carries source-specific parameters, interpreted by the
                              binding connector: Periodic sources take {"period": "5m"}, xds
                              sources the upstream server address.
                            x-kubernetes-preserve-unknown-fields: true
                          predicate:
                            description: |-
                              Predicate is an event-filtering predicate on this source,
                              interpreted by the binding connector.
                            x-kubernetes-preserve-unknown-fields: true
                          type:
                            description: |-
                              Type names the binding connector's producer verb; the default is
                              the connector's canonical one (Kubernetes and xds: Watcher, misc:
                              Tick).
                            type: string
                          version:
                            description: Version is the version of the resource.
                            type: string
                        required:
                        - kind
                        type: object
                      type: array
                    sql:
                      description: SQL is an SQL query applied to the source deltas.
                      x-kubernetes-preserve-unknown-fields: true
                    targets:
                      description: Targets are the resource endpoints the results
                        are written to.
                      items:
                        description: Target is the resource endpoint a controller
                          writes.
                        properties:
                          apiGroup:
                            description: Group is the API group. Default is "<operator>.view.dcontroller.io".
                            type: string
                          kind:
                            description: Kind is the type of the resource. Mandatory.
                            type: string
                          level:
                            description: |-
                              Level switches an Updater target from delta writes to
                              state-of-the-world ownership: the controller writes the full
                              desired set of the kind and owns every object of it. Ignored on
                              targets with no level mode.
                            type: boolean
                          parameters:
                            description: |-
                              Parameters carries target-specific parameters, interpreted by the
                              binding connector: xds targets take the egress server address.
                            x-kubernetes-preserve-unknown-fields: true
                          type:
                            description: Type is the type of the target. Default is
                              Updater.
                            type: string
                          version:
                            description: Version is the version of the resource.
                            type: string
                        required:
                        - kind
                        type: object
                      type: array
                    transforms:
                      description: |-
                        Transforms is the list of circuit transforms applied to the compiled
                        program, in canonical order (the engine orders the set; listing
                        states what the controller is, not the order). An absent list means
                        the default chain: Reconciler, Distincter, Incrementalizer.
                      items:
                        description: "TransformSpec is the serialized form of one
                          transform entry, the shape\ncarried by circuit.transform()
                          in JavaScript and by the transforms list\nof a serialized
                          controller (engine/spec):\n\n\t{\"name\": \"Incrementalizer\"}\n\t{\"name\":
                          \"Reconciler\", \"pairs\": [[\"observed\", \"status\"],
                          ...]}\n\t{\"name\": \"SmithPredictor\", \"pairs\": [...],
                          \"k\": 2}\n\t{\"name\": \"Distincter\", \"key\": <expression>}\n\nPairs
                          name topics (or input_/output_ node IDs; bare names are\ncanonicalized),
                          the SmithPredictor's k is its dead time in circuit\nsteps,
                          and the optional Distincter key turns the plain distinct
                          into\ndistinct_pi."
                        properties:
                          k:
                            type: integer
                          key:
                            description: |-
                              RawMessage is a raw encoded JSON value.
                              It implements [Marshaler] and [Unmarshaler] and can
                              be used to delay JSON decoding or precompute a JSON encoding.
                            format: byte
                            type: string
                          name:
                            type: string
                          pairs:
                            items:
                              items:
                                type: string
                              type: array
                            type: array
                        required:
                        - name
                        type: object
                      type: array
                  required:
                  - name
                  - sources
                  - targets
                  type: object
                maxItems: 255
                minItems: 1
                type: array
            required:
            - controllers
            type: object
          status:
            description: Status defines the current state of the operator.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastErrors:
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
