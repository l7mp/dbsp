apiVersion: dcontroller.io/v1alpha1
kind: Operator
metadata:
  name: configdep-operator
spec:
  controllers:
    - name: configmap-controller
      sources: 
        - apiGroup: ""
          kind: ConfigMap
        - apiGroup: "apps"
          kind: Deployment
        - apiGroup: "dcontroller.io"
          kind: ConfigDeployment
      pipeline:
        - "@join":
            "@and":
              - '@eq':
                  - $.ConfigMap.metadata.name
                  - $.ConfigDeployment.spec.configMap
              - '@eq':
                  - $.Deployment.metadata.name
                  - $.ConfigDeployment.spec.deployment
              - '@eq':
                  - $.ConfigMap.metadata.namespace
                  - $.Deployment.metadata.namespace
              - '@eq':
                  - $.ConfigMap.metadata.namespace
                  - $.ConfigDeployment.metadata.namespace
        - "@project":
            metadata:
              name: "$.Deployment.metadata.name"
              namespace: "$.Deployment.metadata.namespace"
            spec:
              template:
                metadata:
                  annotations:
                    # Content token: changes exactly when the ConfigMap data changes.
                    "dcontroller.io/configmap-version":
                      "@hash": "$.ConfigMap.data"
      # options:
      #   disableDistincter: true
      targets:
        - apiGroup: "apps"
          kind: Deployment
          type: Patcher
